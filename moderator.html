<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderator Panel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090b10;color:#fff;font-family:Inter,system-ui}.app{max-width:1100px;margin:auto;padding:16px}.card{background:#151820;border:1px solid #2a303b;border-radius:18px;padding:16px;margin:14px 0}.input,select,textarea{width:100%;box-sizing:border-box;background:#0f1218;color:#fff;border:1px solid #2a303b;border-radius:12px;padding:11px;margin:6px 0}.btn{border:0;border-radius:11px;padding:10px 13px;color:#fff;font-weight:800;background:#6847ef}.ghost{background:#252a35}.danger{background:#742c34}.good{background:#1b5c44}.muted{color:#9da7b5}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#0f1218;padding:16px;border-radius:14px}.metric b{display:block;font-size:26px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #2a303b;text-align:left}.table{overflow:auto}</style></head><body><div class="app"><h1>Akolias Social Moderator</h1><section id="auth" class="card"><input id="email" class="input" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Password"><button id="login" class="btn">Login</button><div id="msg" class="muted"></div></section><section id="main" class="hide"><div class="card grid"><div class="metric"><b id="mu">0</b>Total Users</div><div class="metric"><b id="mp">0</b>Posts</div><div class="metric"><b id="mr">0</b>Reports</div><div class="metric"><b id="mt">0</b>Support Tickets</div></div><div class="card"><h3>Users</h3><div id="users"></div></div><div class="card"><h3>Reports</h3><div id="reports"></div></div><div class="card"><h3>Support Tickets</h3><div id="tickets"></div></div></section></div><script>
const sb=supabase.createClient("https://mhjtlxxgeepmbxeoravu.supabase.co","sb_publishable_gHUxa_Mrg3UKzhjq9Rr30g_45Mqfex6"),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));let me=null;
$("login").onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return $("msg").textContent=error.message;const {data:a}=await sb.from("admin_users").select("*").eq("user_id",data.user.id).maybeSingle();if(!a)return $("msg").textContent="Not an admin";me=data.user;$("auth").classList.add("hide");$("main").classList.remove("hide");load()};
async function load(){const [u,p,r,t,m]=await Promise.all([sb.from("profiles").select("*"),sb.from("posts").select("*",{count:"exact",head:true}),sb.from("reports").select("*").order("created_at",{ascending:false}),sb.from("support_tickets").select("*").order("created_at",{ascending:false}),sb.from("user_moderation").select("*")]);$("mu").textContent=(u.data||[]).length;$("mp").textContent=p.count||0;$("mr").textContent=(r.data||[]).length;$("mt").textContent=(t.data||[]).length;const mm=Object.fromEntries((m.data||[]).map(x=>[x.user_id,x]));$("users").innerHTML=(u.data||[]).map(x=>`<div class="card row between wrap"><div><b>${esc(x.full_name||"User")}</b><div class="muted">@${esc(x.username||"user")}</div></div><button class="btn ${mm[x.id]?.is_suspended?"good":"danger"}" onclick="suspend('${x.id}',${!mm[x.id]?.is_suspended})">${mm[x.id]?.is_suspended?"Unsuspend":"Suspend"}</button></div>`).join("");$("reports").innerHTML=(r.data||[]).map(x=>`<div class="card"><b>${esc(x.reason)}</b><select onchange="updReport('${x.id}',this.value)"><option value="open" ${x.status==="open"?"selected":""}>open</option><option value="reviewing" ${x.status==="reviewing"?"selected":""}>reviewing</option><option value="resolved" ${x.status==="resolved"?"selected":""}>resolved</option><option value="dismissed" ${x.status==="dismissed"?"selected":""}>dismissed</option></select></div>`).join("");$("tickets").innerHTML=(t.data||[]).map(x=>`<div class="card"><b>#${x.id} · ${esc(x.status)}</b><p>${esc(x.message)}</p><select onchange="updTicket('${x.id}',this.value)"><option>open</option><option>in_progress</option><option>resolved</option><option>closed</option></select></div>`).join("")}
window.suspend=async(id,v)=>{const reason=v?(prompt("Reason:","Community guideline violation")||"Suspended"):"";await sb.from("user_moderation").upsert({user_id:id,is_suspended:v,suspension_reason:v?reason:"",updated_by:me.id,updated_at:new Date().toISOString()},{onConflict:"user_id"});load()};window.updReport=async(id,status)=>{await sb.from("reports").update({status}).eq("id",id);load()};window.updTicket=async(id,status)=>{await sb.from("support_tickets").update({status}).eq("id",id);load()};
</script></body></html>
