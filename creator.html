<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090b10;color:#fff;font-family:Inter,system-ui}.app{max-width:1100px;margin:auto;padding:16px}.card{background:#151820;border:1px solid #2a303b;border-radius:18px;padding:16px;margin:14px 0}.input,select,textarea{width:100%;box-sizing:border-box;background:#0f1218;color:#fff;border:1px solid #2a303b;border-radius:12px;padding:11px;margin:6px 0}.btn{border:0;border-radius:11px;padding:10px 13px;color:#fff;font-weight:800;background:#6847ef}.ghost{background:#252a35}.danger{background:#742c34}.good{background:#1b5c44}.muted{color:#9da7b5}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#0f1218;padding:16px;border-radius:14px}.metric b{display:block;font-size:26px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #2a303b;text-align:left}.table{overflow:auto}</style></head><body><div class="app"><h1>Creator Dashboard</h1><div class="card grid"><div class="metric"><b id="posts">0</b>Posts</div><div class="metric"><b id="followers">0</b>Followers</div><div class="metric"><b id="likes">0</b>Likes</div><div class="metric"><b id="comments">0</b>Comments</div></div><div class="card"><h3>Recent Posts</h3><div id="list"></div></div></div><script>const sb=supabase.createClient("https://mhjtlxxgeepmbxeoravu.supabase.co","sb_publishable_gHUxa_Mrg3UKzhjq9Rr30g_45Mqfex6"),$=id=>document.getElementById(id);(async()=>{const {data:s}=await sb.auth.getSession();if(!s.session)return document.body.innerHTML="<div class='app'><div class='card'>Login from Akolias Social first.</div></div>";const id=s.session.user.id;const [p,f,l,c]=await Promise.all([sb.from("posts").select("*").eq("user_id",id).order("created_at",{ascending:false}),sb.from("follows").select("*",{count:"exact",head:true}).eq("following_id",id),sb.from("likes").select("*").in("post_id",(await sb.from("posts").select("id").eq("user_id",id)).data?.map(x=>x.id)||[]),sb.from("comments").select("*").in("post_id",(await sb.from("posts").select("id").eq("user_id",id)).data?.map(x=>x.id)||[])]);$("posts").textContent=(p.data||[]).length;$("followers").textContent=f.count||0;$("likes").textContent=(l.data||[]).length;$("comments").textContent=(c.data||[]).length;$("list").innerHTML=(p.data||[]).map(x=>`<div class="card">${x.caption||"(no caption)"} · ${new Date(x.created_at).toLocaleString()}</div>`).join("")})();</script></body></html>
