<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akolias Social Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#090b10;color:#fff;font-family:Inter,system-ui}.app{max-width:1000px;margin:auto;padding:16px}.card{background:#151820;border:1px solid #2a303b;border-radius:18px;padding:16px;margin:14px 0}.input,select{width:100%;box-sizing:border-box;background:#0f1218;color:#fff;border:1px solid #2a303b;border-radius:12px;padding:11px;margin:6px 0}.btn{border:0;border-radius:11px;padding:10px 13px;color:#fff;font-weight:800;background:#6847ef}.danger{background:#742c34}.good{background:#1b5c44}.hide{display:none}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #2a303b;text-align:left}.table{overflow:auto}.muted{color:#9da7b5}</style></head>
<body><div class="app"><h1>Akolias Social Admin</h1>
<section id="auth" class="card"><input id="email" class="input" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Password"><button id="login" class="btn">Login</button><div id="msg" class="muted"></div></section>
<section id="main" class="hide"><div class="card"><button id="logout" class="btn">Logout</button></div><div class="card"><h3>Users</h3><div class="table"><table><thead><tr><th>User</th><th>Status</th><th>Reason</th><th>Action</th></tr></thead><tbody id="users"></tbody></table></div></div><div class="card"><h3>Reports</h3><div id="reports"></div></div><div class="card"><h3>Appeals</h3><div id="appeals"></div></div></section></div>
<script>
const sb=supabase.createClient("https://mhjtlxxgeepmbxeoravu.supabase.co","sb_publishable_gHUxa_Mrg3UKzhjq9Rr30g_45Mqfex6");let me=null;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
$("login").onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return $("msg").textContent=error.message;const {data:a}=await sb.from("admin_users").select("*").eq("user_id",data.user.id).maybeSingle();if(!a)return $("msg").textContent="Not an admin";me=data.user;$("auth").classList.add("hide");$("main").classList.remove("hide");loadAll()};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
async function loadAll(){const [pr,mr,rr,ar]=await Promise.all([sb.from("profiles").select("*").limit(300),sb.from("user_moderation").select("*"),sb.from("reports").select("*").order("created_at",{ascending:false}),sb.from("appeals").select("*").order("created_at",{ascending:false})]);const mm=Object.fromEntries((mr.data||[]).map(x=>[x.user_id,x]));$("users").innerHTML=(pr.data||[]).map(u=>{const m=mm[u.id],s=!!m?.is_suspended;return `<tr><td>${esc(u.full_name||"User")}<div class="muted">@${esc(u.username||"user")}</div></td><td>${s?"Suspended":"Active"}</td><td>${esc(m?.suspension_reason||"-")}</td><td><button class="btn ${s?"good":"danger"}" onclick="toggle('${u.id}',${!s})">${s?"Unsuspend":"Suspend"}</button></td></tr>`}).join("");$("reports").innerHTML=(rr.data||[]).map(r=>`<div class="card"><b>${esc(r.reason)}</b><div class="muted">${esc(r.details||"")}</div><select onchange="updateReport('${r.id}',this.value)">
  <option value="open" ${r.status==="open"?"selected":""}>open</option>
  <option value="reviewing" ${r.status==="reviewing"?"selected":""}>reviewing</option>
  <option value="resolved" ${r.status==="resolved"?"selected":""}>resolved</option>
  <option value="dismissed" ${r.status==="dismissed"?"selected":""}>dismissed</option>
</select></div>`).join("");$("appeals").innerHTML=(ar.data||[]).map(a=>`<div class="card"><b>${esc(a.status)}</b><p>${esc(a.message)}</p><select onchange="updateAppeal('${a.id}',this.value)"><option>open</option><option>reviewing</option><option>approved</option><option>rejected</option></select></div>`).join("")}
window.toggle=async(uid,val)=>{const reason=val?(prompt("Suspension reason:","Community guideline violation")||"Suspended by admin"):"";const {error}=await sb.from("user_moderation").upsert({user_id:uid,is_suspended:val,suspension_reason:val?reason:"",updated_by:me.id,updated_at:new Date().toISOString()},{onConflict:"user_id"});if(error)return alert(error.message);loadAll()};
window.updateReport = async (id, status) => {
  const { error } = await sb
    .from("reports")
    .update({ status: status })
    .eq("id", id);

  if (error) {
    alert("Status save error: " + error.message);
    return;
  }

  alert("Status saved ✅");
  await loadAll();
};
window.updateAppeal=async(id,status)=>{await sb.from("appeals").update({status,reviewed_by:me.id,reviewed_at:new Date().toISOString()}).eq("id",id)};
(async()=>{const {data}=await sb.auth.getSession();if(data.session){const {data:a}=await sb.from("admin_users").select("*").eq("user_id",data.session.user.id).maybeSingle();if(a){me=data.session.user;$("auth").classList.add("hide");$("main").classList.remove("hide");loadAll()}}})();
</script></body></html>
